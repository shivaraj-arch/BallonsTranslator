name: Build macOS DMG

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  PYTHON_VERSION: '3.12'
  APP_NAME: 'BallonsTranslator'

jobs:
  build-dmg:
    name: Build DMG for macOS
    runs-on: macos-latest
    timeout-minutes: 240
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Clean up .DS_Store files
        run: |
          echo "Cleaning macOS metadata files..."
          find . -name '.DS_Store' -type f -delete
          echo "✓ Cleaned"
      
      - name: Create virtual environment
        run: |
          echo "Creating Python virtual environment..."
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "✓ Virtual environment ready"
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          source venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pyinstaller
          echo "✓ Dependencies installed"
      
      - name: Download PatchMatch library
        run: |
          echo "Downloading PatchMatch library..."
          mkdir -p .btrans_cache
          
          curl -L \
            https://github.com/dmMaze/PyPatchMatchInpaint/releases/download/v1.0/macos_arm64_patchmatch_libs.7z \
            -o .btrans_cache/macos_arm64_patchmatch_libs.7z
          
          if [ $? -eq 0 ]; then
            echo "✓ Downloaded PatchMatch for Apple Silicon"
          else
            echo "⚠ PatchMatch download failed, will be downloaded at runtime"
          fi
      
      - name: Download AI models
        run: |
          echo "Pre-downloading AI models (this may take 10-20 minutes)..."
          source venv/bin/activate
          
          timeout 1200 python launch.py --help || true
          
          echo "✓ Models prepared"
      
      - name: Build .app with PyInstaller
        run: |
          echo "Building macOS .app bundle..."
          source venv/bin/activate
          
          pip install --no-cache-dir pyinstaller
          
          sudo pyinstaller launch.spec
          
          if [ $? -eq 0 ]; then
            echo "✓ .app bundle created"
            ls -lah dist/
          else
            echo "✗ PyInstaller failed"
            exit 1
          fi
      
      - name: Create DMG from .app
        run: |
          echo "Creating DMG installer..."
          
          # Set proper permissions
          chmod -R u+w dist/BallonsTranslator.app
          
          # Create temp build directory in home directory (better permissions)
          DMG_BUILD="${HOME}/dmg_build"
          rm -rf "$DMG_BUILD"
          mkdir -p "$DMG_BUILD"
          
          # Copy app
          cp -r dist/BallonsTranslator.app "$DMG_BUILD/"
          
          # Create symlink
          ln -s /Applications "$DMG_BUILD/Applications"
          
          # Set permissions on build directory
          chmod -R 755 "$DMG_BUILD"
          
          # Create DMG
          echo "Running hdiutil..."
          hdiutil create \
            -volname "${{ env.APP_NAME }}" \
            -srcfolder "$DMG_BUILD" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/${{ env.APP_NAME }}-$(date +%Y%m%d).dmg" 2>&1
          
          # Verify
          DMG_FILE=$(ls -t dist/*.dmg 2>/dev/null | head -1)
          if [ -f "$DMG_FILE" ]; then
            echo "✓ DMG created successfully: $DMG_FILE"
            ls -lah "$DMG_FILE"
            du -sh "$DMG_FILE"
          else
            echo "✗ DMG creation failed"
            echo "Checking dist directory:"
            ls -lah dist/
            exit 1
          fi
          
          # Clean up
          rm -rf "$DMG_BUILD"
          
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "VERSION = " launch.py | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || echo "dev")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "=========================================="
          echo "Build completed successfully!"
          echo "=========================================="
          echo ""
          echo "📦 Artifacts:"
          ls -lah dist/*.dmg
          echo ""
          echo "📍 Repository: shivaraj-arch/BallonsTranslator"
          echo "✓ DMG file ready for distribution"
